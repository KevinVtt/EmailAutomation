# Producción en VM gratuita. Solo Caddy publica puertos (80/443); el resto queda en la red interna.
# Todas las variables sin default son obligatorias: si falta alguna, compose no arranca.

services:
  caddy:
    image: caddy:2-alpine
    container_name: emailfilter-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  postgres:
    image: postgres:16-alpine
    container_name: emailfilter-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emailfilter}
      POSTGRES_USER: ${POSTGRES_USER:-emailfilter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emailfilter_user} -d ${POSTGRES_DB:-emailfilter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend-java
      dockerfile: Dockerfile
    container_name: emailfilter-backend
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-emailfilter}
      POSTGRES_USER: ${POSTGRES_USER:-emailfilter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?define GOOGLE_CLIENT_ID en .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?define GOOGLE_CLIENT_SECRET en .env}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/callback
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?define TOKEN_ENCRYPTION_KEY en .env}
      AI_SERVICE_URL: http://ai-python:8000
      FRONTEND_URL: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy

  ai-python:
    build:
      context: ./services/ai-python
      dockerfile: Dockerfile
    container_name: emailfilter-ai
    restart: unless-stopped
    mem_limit: 512m
    environment:
      AI_API_KEY: ${AI_API_KEY:?define AI_API_KEY en .env}
      AI_API_URL: ${AI_API_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
    expose:
      - "8000"

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: emailfilter-frontend
    restart: unless-stopped
    mem_limit: 128m
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
