server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:emailfilter}
    username: ${POSTGRES_USER:emailfilter_user}
    password: ${POSTGRES_PASSWORD:changeme_in_prod}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        # NOTE: there are intentionally no `registration` entries here. The app
        # implements the OAuth2 authorization-code flow manually (see AuthController):
        # it builds the provider URL and exchanges the code itself, so Spring's OAuth2
        # client registration is unused. Leaving it present with empty client ids would
        # also make OAuth2ClientAutoConfiguration fail with "Client id must not be empty".
        provider:
          outlook:
            authorization-uri: https://login.microsoftonline.com/${OUTLOOK_TENANT:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${OUTLOOK_TENANT:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/v1.0/me
            user-name-attribute: mail

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

# Aliases used by AuthController (@Value("${google.client-id}") etc.), resolved
# directly from the environment so the backend does not depend on relaxed binding.
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3001/auth/callback}

outlook:
  client-id: ${OUTLOOK_CLIENT_ID:}
  client-secret: ${OUTLOOK_CLIENT_SECRET:}
  redirect-uri: ${OUTLOOK_REDIRECT_URI:http://localhost:3001/auth/callback}
  tenant: ${OUTLOOK_TENANT:common}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:3001}

email:
  sync:
    max-emails: ${EMAIL_SYNC_MAX_EMAILS:1000}
    # Pausa entre cada messages.get (ms) para no superar la cuota por usuario de
    # Gmail (totalQueryCostPerMinutePerUser=6000). 250ms ≈ 240 req/min.
    # Es un espaciado global: fija la tasa agregada aunque se descargue en paralelo.
    request-delay-ms: ${EMAIL_SYNC_REQUEST_DELAY_MS:250}
    # Hilos de descarga de detalle del full sync (solo solapa la latencia de red).
    fetch-concurrency: ${EMAIL_SYNC_FETCH_CONCURRENCY:6}

logging:
  level:
    com.emailfilter: DEBUG
    org.springframework.security: INFO
