server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:emailfilter}?sslmode=${POSTGRES_SSLMODE:prefer}
    username: ${POSTGRES_USER:emailfilter_user}
    password: ${POSTGRES_PASSWORD:changeme_in_prod}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${AI_INTERNAL_TOKEN:}

chat:
  # Mensajes recientes que se envían a la IA; los más viejos quedan como resumen corto.
  context-window: ${CHAT_CONTEXT_WINDOW:10}

# Aliases used by AuthController (@Value("${google.client-id}") etc.), resolved
# directly from the environment so the backend does not depend on relaxed binding.
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3001/auth/callback}

outlook:
  client-id: ${OUTLOOK_CLIENT_ID:}
  client-secret: ${OUTLOOK_CLIENT_SECRET:}
  redirect-uri: ${OUTLOOK_REDIRECT_URI:http://localhost:3001/auth/callback}
  tenant: ${OUTLOOK_TENANT:common}
  # Antes vivía bajo spring.security.oauth2.client.provider.outlook.token-uri, que
  # requería spring-boot-starter-oauth2-client (sin uso: el flow OAuth es manual).
  token-uri: https://login.microsoftonline.com/${OUTLOOK_TENANT:common}/oauth2/v2.0/token

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:3001}

email:
  sync:
    # Pausa entre cada messages.get (ms) para no superar la cuota por usuario de
    # Gmail (totalQueryCostPerMinutePerUser=6000). 400ms ≈ 150 req/min.
    # Es un espaciado global: fija la tasa agregada aunque se descargue en paralelo.
    # Con 250ms/6 hilos, el full sync de un buzón grande (17k mails) moría a los ~300
    # mails con 403 rateLimitExceeded; 400ms/3 hilos pasó de 400 sin error.
    request-delay-ms: ${EMAIL_SYNC_REQUEST_DELAY_MS:400}
    # Hilos de descarga de detalle del full sync (solo solapa la latencia de red).
    # Más de 3 concurrentes dispara el rateLimitExceeded de Gmail.
    fetch-concurrency: ${EMAIL_SYNC_FETCH_CONCURRENCY:3}
  contacts:
    # Días de enviados que se leen la primera vez que se arma la lista de contactos.
    sent-window-days: ${CONTACTS_SENT_WINDOW_DAYS:365}
    # Tope de mails enviados en ese barrido; cada uno cuesta ~20 unidades de cuota.
    sent-max: ${CONTACTS_SENT_MAX:2000}

logging:
  level:
    com.emailfilter: DEBUG
    org.springframework.security: INFO
