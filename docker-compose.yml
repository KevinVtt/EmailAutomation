version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: emailfilter-db
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.0'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emailfilter}
      POSTGRES_USER: ${POSTGRES_USER:-emailfilter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emailfilter_user} -d ${POSTGRES_DB:-emailfilter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend-java
      dockerfile: Dockerfile
    container_name: emailfilter-backend
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    cpus: '1.0'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-emailfilter}
      POSTGRES_USER: ${POSTGRES_USER:-emailfilter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET}
      OUTLOOK_REDIRECT_URI: ${OUTLOOK_REDIRECT_URI}
      OUTLOOK_TENANT: ${OUTLOOK_TENANT:-common}
      AI_SERVICE_URL: http://ai-python:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ai-python:
    build:
      context: ./services/ai-python
      dockerfile: Dockerfile
    container_name: emailfilter-ai
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.0'
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: emailfilter-frontend
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    cpus: '0.5'
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
